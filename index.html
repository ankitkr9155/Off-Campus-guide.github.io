            overflow-y: auto;

            border-radius: 8px;
        }
        
        table {

            text-align: left;
        }
        
        thead {

            top: 0;
            background-color: #1e293b;

        }
        
        th { padding: 14px 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px;}

        .stipend { font-weight: 600; color: #059669; }
        .window { font-weight: 600; color: #ea580c; }

            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;

    function renderTable(data) {

        data.forEach((company, index) => {

                <td class="rank">${index + 1}</td>
                <td class="company">${company[0]}</td>
                <td class="window">${company[1]}</td>
                <td>${company[2]}</td>
                <td class="stipend">${company[3]}</td>
                <td>${company[4]}</td>
                <td><a href="${company[5]}" target="_blank" class="apply-btn">Apply Now</a></td>
            </tr>`;
            tableBody.innerHTML += row;
        });
        countDisplay.innerText = `Showing ${data.length} Companies`;
    }

    function filterTable() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const filteredData = companyData.filter(c => 
            c[0].toLowerCase().includes(query) || 
            c[4].toLowerCase().includes(query) ||
            c[2].toLowerCase().includes(query)
        );
        renderTable(filteredData);
    }
